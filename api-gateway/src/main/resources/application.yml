server:
  port: 8050
  address: 0.0.0.0

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auction-service
          uri: http://localhost:8077
          predicates:
            - Path=/auction/**
          filters:
            - StripPrefix=1
        - id: user-register-service
          uri: http://localhost:8022
          predicates:
            - Path=/account/**
          filters:
            - StripPrefix=1
        - id: images-service
          uri: http://localhost:9000
          predicates:
            - Path=/images/**
          filters:
            - StripPrefix=1
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG